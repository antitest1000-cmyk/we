<main class="page"><p class="eyebrow">BROWSER TOOLS</p><h1>Free text tools</h1><p class="lead">These run locally. No account and no API key.</p>
<div class="tool-grid">
<section class="panel"><h2>Word & character counter</h2><textarea id="counterText" placeholder="Paste or type text here..."></textarea><div class="stats"><b id="words">0</b><span>words</span><b id="chars">0</b><span>characters</span><b id="lines">0</b><span>lines</span></div></section>
<section class="panel"><h2>Case converter</h2><textarea id="caseText" placeholder="Enter text..."></textarea><div class="actions"><button class="btn primary" onclick="convertCase('upper')">UPPERCASE</button><button class="btn ghost" onclick="convertCase('lower')">lowercase</button><button class="btn ghost" onclick="convertCase('title')">Title Case</button></div></section>
<section class="panel"><h2>Random quote</h2><p id="quote" class="quote">Click the button to fetch a quote from a public API.</p><button class="btn primary" onclick="getQuote()">Get quote</button><small id="quoteStatus"></small></section>
